# LigiOpen Documentation Site Configuration
title: LigiOpen
description: The Complete Guide to Kenya's Premier Sports Management Platform
baseurl: ""
url: ""

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation
nav_links:
  - title: Home
    url: /
  - title: Getting Started
    url: /getting-started
  - title: Understanding Roles
    url: /user-roles
  - title: Fan Guide
    url: /fan
  - title: Player Guide
    url: /player
  - title: Club Admin Guide
    url: /club-admin
  - title: League Admin Guide
    url: /league-admin
  - title: Super Admin Guide
    url: /super-admin
  - title: Content Admin Guide
    url: /content-admin
  - title: Official Guide
    url: /official

# SEO
author: LigiOpen Team
logo: /assets/images/ligiopen_logo_nobg.png
social:
  name: LigiOpen
  links:
    - https://github.com/ligiopen

# Build settings
source: .
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docs/

# Include files
include:
  - _layouts
  - _includes
  - assets

# Sass/SCSS settings (we're using plain CSS)
sass:
  style: compressed
  
# Disable theme since we have custom layout
theme: null
